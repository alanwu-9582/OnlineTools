<!DOCTYPE html>

<body>
  <a class="skip-link" href="#page-outlet">跳到主要內容</a>
  <div class="app">
    <nav class="side-nav" id="side-nav" aria-label="主導覽">
      <button type="button" id="sidebar-toggle" class="sidebar-toggle" aria-label="收合側邊欄" aria-expanded="true"
        title="收合側邊欄">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"
          stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <a class="brand" href="#/home">
        <img class="brand-logo" src="assets/images/icon.svg" alt="OnlineTools 標誌">

          <div class="brand-name"><strong>ONLINE</strong>TOOLS</div>
          <div class="brand-sub">Tools · Docs</div>
        </div>

      <button type="button" id="nav-menu-toggle" class="nav-menu-toggle" aria-label="開啟選單"

        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2"
          stroke-linecap="round">
          <line class="bar bar-top" x1="4" y1="7" x2="20" y2="7"></line>
          <line class="bar bar-mid" x1="4" y1="12" x2="20" y2="12"></line>
          <line class="bar bar-bot" x1="4" y1="17" x2="20" y2="17"></line>
        </svg>
      </button>
      <div class="nav-group" id="primary-nav"></div>
      <div class="nav-spacer"></div>
      <div class="nav-foot" id="nav-foot"></div>
    </nav>

    <main class="main" id="page-outlet" tabindex="-1" aria-live="polite">
      <div class="state-block" role="status">
        <div class="spinner" aria-hidden="true"></div>載入中…
      </div>
    </main>
  </div>

  <script type="module" src="js/core/main.js"></script>
